name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: why
          POSTGRES_PASSWORD: why
          POSTGRES_DB: why_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U why -d why_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      WHY_TEST_DATABASE_URL: postgresql+psycopg://why:why@localhost:5432/why_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
