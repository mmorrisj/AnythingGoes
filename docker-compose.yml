services:
  db:
    # pgvector image so the embeddings stage needs no infrastructure change.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: why
      POSTGRES_PASSWORD: why
      POSTGRES_DB: why
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U why -d why"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: .
    environment:
      WHY_DATABASE_URL: postgresql+psycopg://why:why@db:5432/why
      WHY_REPOS_ROOT: /repos
      WHY_EMBEDDING_CACHE_DIR: /home/app/.cache/why
    ports:
      - "8000:8000"
    volumes:
      - ./repos:/repos:ro
      - models:/home/app/.cache/why
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  models:
